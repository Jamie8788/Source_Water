services:
  - type: web
    name: source-water-api
    env: node
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: source-water-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: source-water-redis
          property: connectionString
      - key: ANALYSIS_SERVICE_URL
        value: "http://localhost:8001"
      - key: UPLOAD_DIR
        value: "/opt/render/project/src/uploads"
    healthCheckPath: "/api/health"
    healthCheckInterval: 30
    healthCheckTimeout: 10
    healthCheckRetries: 3
    healthCheckGracePeriod: 30

  - type: web
    name: source-water-client
    env: static
    region: oregon
    plan: free
    buildCommand: "cd client && npm install && npm run build"
    publishPath: "client/dist"
    healthCheckPath: "/"

databases:
  - name: source-water-db
    plan: free
    region: oregon

  - name: source-water-redis
    plan: free
    region: oregon
    type: redis