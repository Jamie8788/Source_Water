services:
  # ── Python ML/Analysis Service ───────────────────────────────────────────────
  - type: web
    name: source-water-analysis
    runtime: python
    rootDir: analysis-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Node.js App ───────────────────────────────────────────────────────────────
  - type: web
    name: source-water-app
    runtime: node
    rootDir: server
    buildCommand: >
      cd ../client && npm install --include=dev --legacy-peer-deps &&
      VITE_API_URL=/api
      VITE_ANALYSIS_URL=/ml
      VITE_SUPABASE_URL=https://qnshfvxsvqulwywiiepd.supabase.co
      VITE_SUPABASE_ANON_KEY=sb_publishable_H0jTgJvTnvBGN1xd8_X-ag_aK3Nk80s
      VITE_CLOUDINARY_CLOUD_NAME=ds85lrhbs
      npm run build &&
      cd ../server && npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-2-9b-it:free
      - key: GROQ_API_KEY
        sync: false
      - key: ANALYSIS_SERVICE_URL
        value: https://source-water-analysis.onrender.com
      - key: SUPABASE_URL
        value: https://qnshfvxsvqulwywiiepd.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_H0jTgJvTnvBGN1xd8_X-ag_aK3Nk80s
      - key: CLOUDINARY_CLOUD_NAME
        value: ds85lrhbs
      - key: CLOUDINARY_API_KEY
        value: "264342763949696"
      - key: CLOUDINARY_API_SECRET
        sync: false
