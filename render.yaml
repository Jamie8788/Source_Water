services:
  # ── Python ML/Analysis Service ───────────────────────────────────────────────
  - type: web
    name: source-water-analysis
    runtime: python
    rootDir: analysis-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # ← paste your key here in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Node.js server  (serves frontend + API + proxies ML) ─────────────────────
  - type: web
    name: source-water-app
    runtime: node
    rootDir: server
    # Build client first, then install server deps
    buildCommand: >
      cd ../client &&
      npm install &&
      VITE_API_URL=/api VITE_ANALYSIS_URL=/ml npm run build &&
      cd ../server &&
      npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/source-water.db
      - key: MAX_FILE_SIZE
        value: "104857600"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-2-9b-it:free
      - key: ANALYSIS_SERVICE_URL
        fromService:
          name: source-water-analysis
          type: web
          envVarKey: RENDER_EXTERNAL_URL
