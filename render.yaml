services:
  # ── Python ML/Analysis Service ───────────────────────────────────────────────
  - type: web
    name: source-water-analysis
    runtime: python
    rootDir: analysis-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Node.js app — rootDir=server so index.js runs with correct __dirname ─────
  - type: web
    name: source-water-app
    runtime: node
    rootDir: server
    buildCommand: "cd ../client && npm install --legacy-peer-deps && VITE_API_URL=/api VITE_ANALYSIS_URL=/ml npm run build && cd ../server && npm install"
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-2-9b-it:free
      - key: ANALYSIS_SERVICE_URL
        sync: false
