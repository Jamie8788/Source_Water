services:
  # ── Python ML/Analysis Service ───────────────────────────────────────────────
  - type: web
    name: source-water-analysis
    runtime: python
    rootDir: analysis-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Node.js app (Docker — builds client + serves everything) ─────────────────
  - type: web
    name: source-water-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-2-9b-it:free
      - key: ANALYSIS_SERVICE_URL
        fromService:
          name: source-water-analysis
          type: web
          envVarKey: RENDER_EXTERNAL_URL
